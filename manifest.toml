#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "mixpost"
name = "Mixpost"
description.en = "Schedule, publish, and manage your social media content on your server"
description.fr = "Planifiez, publiez et gérez le contenu de vos médias sociaux sur votre serveur"

version = "2.1.0~ynh2"

maintainers = ["eric_G"]

[upstream]
license = "MIT"
website = "https://mixpost.app/"
admindoc = "https://docs.mixpost.app/lite/installation/manual"
code = "https://github.com/inovector/MixpostApp"

[integration]
yunohost = ">= 12.0.9"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false

sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    #[install.path]
    #type = "path"
    #default = "/mixpost"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/inovector/MixpostApp/archive/refs/tags/v2.1.0.tar.gz"
    sha256 = "82f25550ef1b992c6e0452af7a8af978ccb19d427f7a9806c5899fc3832de40e"

    autoupdate.strategy = "latest_github_tag"

    [resources.system_user]
    allow_email = true

    [resources.install_dir]
    group = "www-data:r-x"
    
    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = "mariadb-server, ffmpeg, redis-server, php8.4-curl, php8.4-mysql, php8.4-bcmath, php8.4-gd, php8.4-mbstring, php8.4-redis, php8.4-xml, php8.4-zip, php8.4-intl"

    [resources.database]
    type = "mysql"

    [resources.composer]
    version = "2.9.8"
